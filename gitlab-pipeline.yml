# GitLab CI/CD pipeline

stages:
  - install
  - build
  - test
  - deploy

# ----------------------------------------
# 1. Install Dependencies
# ----------------------------------------
install_dependencies:
  stage: install
  script:
    - echo "Installing Node.js dependencies..."
    - npm ci
  cache:
    key: node_modules
    paths:
      - node_modules/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ----------------------------------------
# 2. Build Stage
# ----------------------------------------
build_app:
  stage: build
  script:
    - echo "Building application..."
    - npm run build
  needs:
    - install_dependencies
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

# ----------------------------------------
# 3. Test Stage
# ----------------------------------------
run_tests:
  stage: test
  script:
    - echo "Running test cases..."
    - npm test
  needs:
    - build_app

# ----------------------------------------
# 4. Deploy Stage (Manual)
# ----------------------------------------
deploy_to_staging:
  stage: deploy
  script:
    - echo "Deploying application to staging..."
    - ./deploy.sh staging
  environment:
    name: staging
  when: manual
  only:
    - main
  needs:
    - run_tests
